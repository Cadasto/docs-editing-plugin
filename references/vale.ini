# Reference Vale configuration for prose linting.
#
# Vale (https://vale.sh) is the de-facto prose linter: it checks style, not spelling,
# and is the enforcing tool for the mechanical half of references/style-guide.md.
# `/docs-lint-setup` copies this file to a repo's `.vale.ini`; it is a starting point,
# not a frozen contract — tune `MinAlertLevel` and the disabled rules per repo.
#
# After installing:
#   vale sync          # download the style packages named below into StylesPath
#   vale .             # lint the repo
#
# StylesPath is gitignored (the packages are downloadable, not source).

StylesPath = styles
MinAlertLevel = suggestion

# Google's developer-documentation style guide is the closest public match to the
# house style, and its rules are well-maintained. write-good catches passive voice,
# weasel words and hedges; alex catches insensitive phrasing; proselint catches
# clichés and redundancy. Microsoft's package is an alternative to Google's — enable
# one or the other, never both (their rules contradict on person and contractions).
Packages = Google, write-good, alex, proselint

# Project terminology and accepted spellings, in
# styles/config/vocabularies/<Vocab>/{accept,reject}.txt. `Project` is a neutral
# default — rename it to the repo or product name if you prefer, and rename the
# directory to match: a `Vocab` with no matching directory is a hard error
# (`E100 [vocab]`, exit 2) on the next lint.
# Seed `accept.txt` from references/vocab-accept.txt — Vale.Spelling reads a
# general dictionary, so an empty one drowns real findings in jargon false
# positives — then append this repo's own terms. It is the canonical term list
# that keeps naming fixed per §3 of the style guide. `reject.txt` is where banned
# marketing vocabulary goes so the linter, not a reviewer, catches it.
Vocab = Project

[*.{md,mdx,markdown}]
BasedOnStyles = Vale, Google, write-good, alex, proselint

# --- Deliberate deviations from the Google package -------------------------------
# British spelling in prose; code identifiers keep their own spelling (style guide §3).
Google.Spelling = NO
# Semantic line breaks are welcome here, so sentence-per-line triggers false positives.
Google.Parens = NO
# The house style permits spaced em dashes for parenthetical breaks.
Google.EmDash = NO
# Google's package assumes American punctuation-inside-quotes. The house style is
# British, which places the comma or period outside unless it belongs to the quote
# (style guide §3), so this rule fires on correct prose.
Google.Quotes = NO
# Headings are sentence case, which Google's package already enforces — keep it on.
Google.Headings = YES
# "we" is disallowed in reference docs but legitimate in marketing copy; enforce by
# review rather than globally, since Vale cannot tell the two contexts apart.
Google.We = suggestion

# --- Escalations -----------------------------------------------------------------
# These map to explicit style-guide bans, so they are errors rather than suggestions.
Google.Will = error          # future tense where present tense belongs (§1)
write-good.Weasel = error    # "very", "really", "basically" (§2)
write-good.Illusions = error # "simply", "just", "obviously" (§4)
alex.Condescending = error   # "easy", "simply", "of course" (§4)

# Generated and vendored content is not ours to restyle.
[{CHANGELOG.md,LICENSE}]
BasedOnStyles = Vale

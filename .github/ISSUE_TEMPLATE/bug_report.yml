name: Bug report
description: Report a reproducible problem to help us improve
labels: ["bug", "needs-triage"]
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-checks
      options:
        - label: I have searched existing issues to ensure this hasn't been reported already.
          required: true
        - label: I have read the README, AGENTS.md, and relevant docs.
          required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the plugin is affected?
      options:
        - Router skill (docs-editing)
        - Skill (technical-writing / copy-editing / marketing-copy)
        - Skill (seo-audit / ai-seo)
        - Skill (docs-lint-setup)
        - Agent (prose-reviewer / seo-auditor)
        - Hooks (SessionStart / prose-lint-on-save)
        - References (style guide, doc types, claims and evidence, SEO checklist, linter configs)
        - Cursor rule (rules/*.mdc)
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: claims
    attributes:
      label: Claim fabrication
      description: The plugin's core rule is that no claim ships without a traceable source.
      options:
        - label: This report is about a component producing an unsourced statistic, testimonial, customer name, award, urgency device, or superlative. (We treat these as high priority.)
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: What version/commit are you using? (e.g., git SHA or tag)
      placeholder: vX.Y.Z or commit SHA
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Any relevant environment details
      placeholder: |
        - AI assistant: Claude Code, Cursor, etc.
        - OS: macOS / Linux / Windows (WSL)
        - Vale installed (if relevant): vale --version
        - Docs generator (if relevant): MkDocs / Docusaurus / other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Describe the bug and the expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide a minimal set of steps to reproduce the issue
      placeholder: |
        1. In a repo with ...
        2. Run /copy-editing on ...
        3. See ...
  - type: textarea
    id: logs
    attributes:
      label: Logs and output
      description: Paste relevant output, error messages, or validator output.
      render: shell
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other context, links to related issues/PRs, screenshots

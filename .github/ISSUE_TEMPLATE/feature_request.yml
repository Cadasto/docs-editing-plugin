name: Feature request
description: Suggest an idea to improve this project
labels: ["enhancement", "needs-triage"]
title: "feat: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement! Please provide as much detail as you can.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-checks
      options:
        - label: I have searched existing issues to ensure this hasn't been requested already.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Is your feature request related to a problem? Please describe.
      placeholder: I'm frustrated when...
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the solution you'd like.
      placeholder: Clearly describe what you want to happen.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the plugin is this request related to?
      options:
        - Router skill (docs-editing)
        - Skill (technical-writing / copy-editing / marketing-copy)
        - Skill (seo-audit / ai-seo)
        - Skill (docs-lint-setup)
        - Agent (prose-reviewer / seo-auditor)
        - Hooks (SessionStart / prose-lint-on-save)
        - References (style guide, doc types, claims and evidence, SEO checklist, linter configs)
        - Cursor rule (rules/*.mdc)
        - Documentation
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe alternatives or workarounds you've considered
  - type: textarea
    id: impact
    attributes:
      label: Impact and scope
      description: Which parts of the plugin would be affected? Any breaking changes?
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other context or screenshots

# Text addressed to the person who prompted a model, left in a published page.
# Error level, so only phrasings with no ordinary documentation use belong here: a
# token that also fits a human README ("let me know if you…") would block merges.
# Judgement cases stay in references/ai-tells.md §1. Apostrophes match ' and ’.
extends: existence
message: "Chatbot residue '%s': this addresses the prompter, not the reader. Delete it."
level: error
ignorecase: true
tokens:
  - 'as an AI language model'
  - 'as an AI(?: language model)?, I\b'
  - 'as of my (?:last|latest) (?:knowledge )?(?:update|training)'
  - 'my knowledge cut-?off'
  - 'my training data'
  - 'I hope this helps'
  - 'great question'
  - 'I(?:[''’]d| would) be (?:happy|glad) to help'
  - 'here(?:[''’]s| is) (?:your|the) (?:revised|rewritten|polished) version'
